name: my_compass
description: A comprehensive outdoor & wilderness navigation application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # البوصلة والحساسات
  flutter_compass: ^0.8.0
  sensors_plus: ^6.0.0

  # الموقع والإحداثيات
  geolocator: ^10.1.0
  latlong2: ^0.9.1

  # الخرائط الطبوغرافية بدون إنترنت
  flutter_map: ^7.0.0

  # البوصلة الضوئية والكاميرا
  camera: ^0.11.0

  # إشارات الطوارئ (الفلاش)
  torch_light: ^1.0.0

  # الاهتزاز عند محاذاة الشمال
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # إضافة الملحقات والأيقونات إن وجدت
  # assets:
  #   - assets/images/
  
