name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Complete Clean App
        run: |
          rm -rf my_compass_app
          flutter create --platforms=android --org com.example.compass my_compass_app
          cd my_compass_app
          
          # إدخال المكتبات في pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: my_compass_app
          description: A compass app pointing to target coordinates.
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_compass: ^0.8.0
            geolocator: ^10.1.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF

          # إضافة أذونات الجي بي إس والموقع
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          # نقل الكود البرمجي الرئيسي
          cp ../lib/main.dart lib/main.dart

          # جلب المكتبات والبناء
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # نقل ملف الـ APK لمسار الرفع
          mkdir -p ../output_apk
          cp build/app/outputs/flutter-apk/app-release.apk ../output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Compass-Release
          path: output_apk/app-release.apk
          
