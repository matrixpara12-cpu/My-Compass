name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Recreate Android Project & Build APK
        run: |
          # 1. إنشاء مشروع Flutter مؤقت نظيف ومستقر
          flutter create --platforms=android app_temp
          
          # 2. استبدال مجلد الأندرويد ومجلد lib وبقية المكونات بملفات مشروعك
          cp -r app_temp/android ./android
          rm -rf app_temp
          
          # 3. إدراج أذونات الجي بي إس في Manifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          
          # 4. جلب المكتبات والبناء
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Compass-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
