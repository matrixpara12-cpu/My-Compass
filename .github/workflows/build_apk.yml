name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build Clean App
        run: |
          # 1. حفظ كود main.dart الاصلي جانباً
          mkdir -p /tmp/my_code
          cp lib/main.dart /tmp/my_code/main.dart

          # 2. إنشاء مشروع Flutter جديد كلياً وبإعدادات Android سليمة
          cd ..
          rm -rf app_build
          flutter create --platforms=android --org com.example.compass app_build
          cd app_build

          # 3. إعداد pubspec.yaml بالمكتبات المطلوبة
          cat << 'EOF' > pubspec.yaml
          name: app_build
          description: A compass app pointing to target coordinates.
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_compass: ^0.8.0
            geolocator: ^10.1.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF

          # 4. إرجاع كود الصفحة الرئيسية وإضافة أذونات الجي بي إس
          cp /tmp/my_code/main.dart lib/main.dart
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          # 5. التجميع والتصدير
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 6. نقل ملف الـ APK النهائي لمسار المخرجات
          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Compass-Release
          path: output_apk/app-release.apk
          
